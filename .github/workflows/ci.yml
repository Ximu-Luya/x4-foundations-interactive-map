name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Verify project
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Ensure target translations come from Crowdin
        if: github.event_name == 'pull_request' && github.head_ref != 'l10n_main'
        shell: bash
        run: |
          if ! git diff --quiet "origin/${GITHUB_BASE_REF}...HEAD" -- src/locales/zh-CN.json; then
            echo "src/locales/zh-CN.json 只能由 Crowdin 的 l10n_main PR 修改。"
            exit 1
          fi

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Verify complete Crowdin translation
        if: github.event_name == 'pull_request' && github.head_ref == 'l10n_main'
        run: npm run i18n:check:complete

      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium

      - name: Run project verification
        run: npm run verify

      - name: Upload Playwright evidence
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-evidence
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore
          retention-days: 7
